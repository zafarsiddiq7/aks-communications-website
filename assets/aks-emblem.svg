<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 150" role="img" aria-labelledby="title desc">
<title>AKS Communications emblem</title><desc>Gold hexagonal AKS Communications mark on a dark teal background.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061416"/><stop offset="1" stop-color="#056879"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0c28f"/><stop offset=".55" stop-color="#c39b61"/><stop offset="1" stop-color="#9d7442"/></linearGradient></defs>
<rect width="420" height="150" rx="16" fill="url(#bg)"/>
<g transform="translate(18 15)">
<polygon points="60,0 112,30 112,90 60,120 8,90 8,30" fill="url(#gold)" stroke="#e7cfaa" stroke-width="3"/>
<text x="60" y="66" text-anchor="middle" font-family="Georgia,serif" font-size="35" letter-spacing="6" fill="#071316">AKS</text>
<path d="M29 76h62" stroke="#071316" stroke-width="2"/>
<text x="60" y="91" text-anchor="middle" font-family="Arial,sans-serif" font-size="8" letter-spacing="3" fill="#071316">COMMUNICATION</text>
