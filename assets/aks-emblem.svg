<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" role="img" aria-labelledby="title desc">
<title>AKS Communications</title>
<desc>AKS Communications logo with a gold hexagonal AKS emblem and the AKS Communications wordmark.</desc>
<defs>
  <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#e0c28f"/>
    <stop offset=".55" stop-color="#c39b61"/>
    <stop offset="1" stop-color="#9d7442"/>
  </linearGradient>
</defs>
<g transform="translate(4 8)">
  <polygon points="52,0 96,25 96,75 52,100 8,75 8,25" fill="none" stroke="url(#gold)" stroke-width="3"/>
