</g>
<text x="130" y="57" font-family="Georgia,serif" font-size="34" letter-spacing="3" fill="url(#gold)">AKS</text>
<text x="132" y="82" font-family="Arial,sans-serif" font-size="11" letter-spacing="5" fill="#e1c89e">COMMUNICATIONS</text>
</svg>